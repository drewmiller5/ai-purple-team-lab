services:
  target:
    build:
      context: .
      dockerfile: target/Dockerfile
    container_name: purple-lab-target
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    # H71 correction: target must NEVER get a ports: entry or join any
    # non-internal network directly. A security review of the first H71
    # attempt (which added target-host-net -- non-internal -- directly to
    # target) live-verified that non-internal bridge networks get Docker's
    # default outbound NAT/masquerade rule: target gained real internet
    # egress (confirmed: `curl https://example.com/` from inside the
    # container returned 200). That breaks this project's own explicit
    # Non-Negotiable (docs/design.md: "The target stays fully egress-
    # blocked... no real internet egress, ever. This is what makes live
    # attack automation safe to build and run at all.") -- target carries
    # a seeded OS command injection with NET_ADMIN, so a real egress path
    # is a real exfiltration/C2 channel post-compromise. See target-relay
    # below for the actual fix: a separate, non-exploitable forwarding-
    # only container is the thing that touches a non-internal network,
    # never target itself.
    networks:
      - lab-net
      # Task 8 (H7 network-segmentation half): target is the only service
      # multi-homed onto both lab-net (reachable by red_agent/blue_agent/
      # purple_dashboard) and wazuh-net (wazuh.manager/wazuh.indexer's
      # control-plane network, for agent enrollment) -- this is what lets
      # red_agent stay off wazuh-net entirely while target still enrolls.
      - wazuh-net
    depends_on:
      - wazuh.manager
    healthcheck:
      # target's entrypoint retries Wazuh agent enrollment (~50-60s observed)
      # before Flask starts serving -- retries=30 gives ~150s of post-start-
      # period headroom (failures before start_period don't count against
      # retries), comfortably above the observed startup time with margin
      # for slower CI/grading runs, not just the ~50% headroom retries=20 gave.
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    environment:
      - WAZUH_MANAGER=wazuh.manager
      # Required, externally supplied shared credential for Blue and Wazuh AR.
      # No default: target fails closed if it is absent.
      - INTERNAL_ACTION_TOKEN=${INTERNAL_ACTION_TOKEN:?set INTERNAL_ACTION_TOKEN before starting the lab}
    volumes:
      - target-logs:/app/target/logs
      - event-log:/app/shared_logs
      # Active Response with <location>local</location> executes on the
      # agent that generated the triggering event (i.e. target itself),
      # not on the manager -- confirmed empirically during Task 7 (see
      # /var/ossec/logs/active-responses.log on this container, not the
      # manager's). The custom lock-account/kill-session commands must
      # therefore be present in target's own active-response bin dir too,
      # matching the same path Wazuh's real agent binary expects.
      - ./wazuh/active-response/lock-account.sh:/var/ossec/active-response/bin/lock-account.sh
      - ./wazuh/active-response/kill-session.sh:/var/ossec/active-response/bin/kill-session.sh
      # Task 8: custom counting AR scripts -- see wazuh-rules/target_rules.xml
      # header and wazuh_manager.conf for why native frequency correlation
      # was abandoned in favor of these.
      - ./wazuh/active-response/bruteforce-guard.sh:/var/ossec/active-response/bin/bruteforce-guard.sh
      - ./wazuh/active-response/idor-guard.sh:/var/ossec/active-response/bin/idor-guard.sh
      # Task 8 (H7/H48): same pre-shared key mounted into wazuh.manager
      # (see that service's volumes) -- entrypoint.sh reads it to pass
      # agent-auth -P, matching wazuh_manager.conf's <use_password>yes</use_password>.
      - ./wazuh/config/wazuh_cluster/authd.pass:/run/secrets/wazuh_authd.pass:ro

  target-relay:
    # H71: forwarding-only container so a human operator can browse to
    # http://localhost:5000 and manually try target's seeded vulnerabilities
    # -- target itself never gets a ports: entry or non-internal network
    # membership (see target's own networks: comment for why: it would
    # give target real internet egress, breaking the project's egress-
    # block Non-Negotiable). This container has no application code of its
    # own (a stock, minimal socat image, no custom build) and never
    # initiates outbound connections anywhere except target:5000 on
    # lab-net -- nothing meaningful to compromise or exfiltrate through,
    # unlike target. Same pattern as the throwaway alpine/socat relay used
    # ad hoc for a live view earlier in this project's history, now made a
    # permanent, first-class part of the stack per explicit user request.
    image: alpine/socat
    container_name: purple-lab-target-relay
    restart: unless-stopped
    command: tcp-listen:5000,fork,reuseaddr tcp-connect:target:5000
    ports:
      # H71: bound to 127.0.0.1 only, not all interfaces -- target ships
      # real seeded vulnerabilities (SQLi, bruteforce, IDOR, OS command
      # injection with NET_ADMIN), same loopback-only posture Task 8
      # established for Wazuh's exposed ports (H48/H53).
      - "127.0.0.1:5000:5000"
    networks:
      - lab-net
      # target-host-net, see its own networks: comment below -- lab-net is
      # internal:true, which is why this relay needs a second, non-
      # internal network for the ports: mapping above to actually bind.
      - target-host-net
    depends_on:
      target:
        condition: service_healthy

  red_agent:
    build:
      context: .
      dockerfile: red_agent/Dockerfile
    container_name: purple-lab-red
    restart: on-failure
    networks:
      - lab-net
      - agent-net
    depends_on:
      target:
        condition: service_healthy
    environment:
      - TARGET_BASE_URL=http://target:5000
      - OLLAMA_HOST=http://host.docker.internal:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:7b}
      # Time (the referee's 900s round budget) is the intended kill switch,
      # not an arbitrary action count -- 300 is well above what red could
      # realistically use in 900s at its observed pace (~1 action/5-10s),
      # so the round budget binds first, not this cap.
      - RED_MAX_ITERATIONS=300
      - RED_MEMORY_PATH=/app/red_agent/memory/red_memory.json
      - EVENT_LOG_PATH=/app/shared_logs/events.jsonl
      - REFEREE_STATE_DIR=/app/referee_state
      # Memory on/off toggle: set to false to run a round with red/blue
      # blind to red_memory.json/blue_memory.json (recall_past_findings
      # returns nothing) without deleting either file. Comparison/demo flag.
      - MEMORY_ENABLED=${MEMORY_ENABLED:-true}
    volumes:
      - red-memory:/app/red_agent/memory
      - event-log:/app/shared_logs
      - referee-state:/app/referee_state:ro

  blue_agent:
    build:
      context: .
      dockerfile: blue_agent/Dockerfile
    container_name: purple-lab-blue
    restart: on-failure
    networks:
      - lab-net
      - agent-net
    depends_on:
      - target
      - wazuh.manager
    environment:
      - TARGET_BASE_URL=http://target:5000
      - INTERNAL_ACTION_TOKEN=${INTERNAL_ACTION_TOKEN:?set INTERNAL_ACTION_TOKEN before starting the lab}
      - OLLAMA_HOST=http://host.docker.internal:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:7b}
      - BLUE_MAX_ITERATIONS=200
      - BLUE_POLL_INTERVAL_SECONDS=5
      - BLUE_MEMORY_PATH=/app/blue_agent/memory/blue_memory.json
      - EVENT_LOG_PATH=/app/shared_logs/events.jsonl
      - WAZUH_ALERTS_PATH=/var/ossec/logs/alerts/alerts.json
      - REFEREE_STATE_DIR=/app/referee_state
      - MEMORY_ENABLED=${MEMORY_ENABLED:-true}
    volumes:
      - blue-memory:/app/blue_agent/memory
      - event-log:/app/shared_logs
      # Read-only: blue only ever reads Wazuh's alert stream, never writes
      # into the manager's own log volume.
      - wazuh_logs:/var/ossec/logs:ro
      # Read-only: only the referee (Task 9) writes go.flag/stop.flag here.
      - referee-state:/app/referee_state:ro

  referee:
    build:
      context: .
      dockerfile: referee/Dockerfile
    container_name: purple-lab-referee
    # H50: previously no restart policy at all, so a crash left the round
    # permanently stuck (manual intervention required, but no state
    # corruption). on-failure trades that for auto-recovery, but referee's
    # round-start time and current flag assignment aren't persisted to
    # disk (only `processed_through` is) -- a crash-restart mid-round
    # silently resets the round's time budget and appends a spurious extra
    # white_memory.json "preparation" entry, rather than resuming cleanly.
    # Flagged independently by dual review; judged an acceptable tradeoff
    # for coursework (crash-mid-round is rare, "stuck forever" is a worse
    # default failure mode than "occasionally resets"), not fixed here --
    # would need round state persisted alongside processed_through to do
    # properly.
    restart: on-failure
    # Deliberately no `networks:` entry -- the referee never makes an HTTP
    # call to anything. It only reads the shared event log and writes flag
    # files/its own assessment log, all via volumes. This is the strongest
    # form of "no direct kill capability over either agent" from the
    # design spec §5 -- it isn't merely disciplined not to call red/blue,
    # it has no route to reach them at all.
    environment:
      - EVENT_LOG_PATH=/app/shared_logs/events.jsonl
      - REFEREE_LOG_PATH=/app/referee_logs/referee_assessments.jsonl
      - REFEREE_STATE_DIR=/app/referee_state
      - REFEREE_MAX_ROUND_SECONDS=900
      - REFEREE_BLUE_STALE_SECONDS=90
      - REFEREE_BLUE_WIN_STREAK=3
      - REFEREE_POLL_INTERVAL_SECONDS=3
      - WHITE_MEMORY_PATH=/app/referee_logs/white_memory.json
      - RED_MEMORY_PATH=/app/red_memory_ro/red_memory.json
    volumes:
      # Read-only -- referee reads the shared event log but its own
      # assessment log lives in a separate volume it owns exclusively.
      - event-log:/app/shared_logs:ro
      - referee-logs:/app/referee_logs
      - referee-state:/app/referee_state
      # Read-only -- white team's flag-selection logic reads red's memory
      # to avoid re-assigning a flag red has already found, but never
      # writes into it. White's own record lives in referee-logs above.
      - red-memory:/app/red_memory_ro:ro

  purple_dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    container_name: purple-lab-dashboard
    restart: unless-stopped
    # Moved off the isolated dashboard-net onto lab-net (reach target) and
    # agent-net (reach Ollama + round_helper) -- Plan 3D's whole point is
    # letting a human act, not just observe. Disclosed, deliberate change
    # to the isolation posture built in the read-only version of this
    # service.
    networks:
      - lab-net
      - agent-net
    ports:
      # Loopback only, matching target-relay and wazuh.dashboard -- was 0.0.0.0 (2026-10-16 backtest).
      - "127.0.0.1:8080:8080"
    environment:
      - EVENT_LOG_PATH=/app/shared_logs/events.jsonl
      - REFEREE_LOG_PATH=/app/referee_logs/referee_assessments.jsonl
      - REFEREE_STATE_DIR=/app/referee_state
      - TARGET_BASE_URL=http://target:5000
      - INTERNAL_ACTION_TOKEN=${INTERNAL_ACTION_TOKEN:?set INTERNAL_ACTION_TOKEN before starting the lab}
      - ROUND_HELPER_TOKEN=${ROUND_HELPER_TOKEN:?set ROUND_HELPER_TOKEN before starting the lab}
      - DASHBOARD_AUTH_TOKEN=${DASHBOARD_AUTH_TOKEN:?set DASHBOARD_AUTH_TOKEN before starting the lab}
      # H55: separate the dashboard's 3 privilege domains -- red action,
      # blue action, and infra control (round restart, via round_helper's
      # docker.sock access) -- from DASHBOARD_AUTH_TOKEN (which only
      # proves "may view this dashboard") and from each other, so one
      # leaked token grants at most one capability.
      - DASHBOARD_RED_ACTION_TOKEN=${DASHBOARD_RED_ACTION_TOKEN:?set DASHBOARD_RED_ACTION_TOKEN before starting the lab}
      - DASHBOARD_BLUE_ACTION_TOKEN=${DASHBOARD_BLUE_ACTION_TOKEN:?set DASHBOARD_BLUE_ACTION_TOKEN before starting the lab}
      - DASHBOARD_INFRA_ACTION_TOKEN=${DASHBOARD_INFRA_ACTION_TOKEN:?set DASHBOARD_INFRA_ACTION_TOKEN before starting the lab}
      - ROUND_HELPER_URL=http://round_helper:8090
      - OLLAMA_HOST=http://host.docker.internal:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:7b}
      - ADVISOR_LOG_PATH=/app/referee_logs/advisor_log.jsonl
    volumes:
      - event-log:/app/shared_logs
      - referee-logs:/app/referee_logs
      # No longer :ro -- manual round control needs to touch/clear
      # go.flag/stop.flag.
      - referee-state:/app/referee_state

  round_helper:
    build:
      context: .
      dockerfile: round_helper/Dockerfile
    container_name: purple-lab-round-helper
    # unless-stopped, not on-failure: round_helper is a persistent
    # control-plane server (same lifecycle class as target/purple_dashboard,
    # both unless-stopped below) -- it has no round-boundary exit logic at
    # all, unlike referee/red_agent/blue_agent, which really do return
    # cleanly at round end. Both dual-review passes on this task
    # independently flagged on-failure as the wrong policy for it.
    restart: unless-stopped
    networks:
      - agent-net
    volumes:
      # :ro only protects the socket *file* on this mount point -- it does
      # not narrow the Docker Engine API reachable over it (still full
      # root-equivalent). The actual scoping is app-level: app.py's
      # hardcoded ALLOWED_CONTAINERS allowlist + ROUND_HELPER_TOKEN auth
      # (H54: its own dedicated secret, not target's INTERNAL_ACTION_TOKEN),
      # never :ro.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - COMPOSE_PROJECT_DIR=/app
      # H54: dedicated secret, distinct from target's INTERNAL_ACTION_TOKEN
      # -- see the agent-net INVARIANT comment below for why this matters.
      - ROUND_HELPER_TOKEN=${ROUND_HELPER_TOKEN:?set ROUND_HELPER_TOKEN before starting the lab}

  wazuh.indexer:
    image: wazuh/wazuh-indexer:4.9.2
    container_name: purple-lab-wazuh-indexer
    hostname: wazuh.indexer
    restart: always
    networks:
      - wazuh-net
    # No `ports:` -- host access to the raw OpenSearch API was a debugging
    # convenience only (curl/Postman), not something the experiment needs:
    # the dashboard and wazuh.manager both talk to this over wazuh-net
    # internally, and blue_agent reads alerts via a read-only file mount,
    # never this API. Previously bound 127.0.0.1:9200:9200 -- observed
    # live to silently and inconsistently drop that binding across Docker
    # Desktop engine restarts (WSL2 networking quirk, not a stale
    # container: the container's own config-hash matched what was on
    # disk, so `up -d` wouldn't have touched it either way). Removed
    # rather than chased, since nothing here depends on it.
    environment:
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - wazuh-indexer-data:/var/lib/wazuh-indexer
      - ./wazuh/config/wazuh_indexer_ssl_certs/root-ca.pem:/usr/share/wazuh-indexer/certs/root-ca.pem
      - ./wazuh/config/wazuh_indexer_ssl_certs/wazuh.indexer-key.pem:/usr/share/wazuh-indexer/certs/wazuh.indexer.key
      - ./wazuh/config/wazuh_indexer_ssl_certs/wazuh.indexer.pem:/usr/share/wazuh-indexer/certs/wazuh.indexer.pem
      - ./wazuh/config/wazuh_indexer_ssl_certs/admin.pem:/usr/share/wazuh-indexer/certs/admin.pem
      - ./wazuh/config/wazuh_indexer_ssl_certs/admin-key.pem:/usr/share/wazuh-indexer/certs/admin-key.pem
      - ./wazuh/config/wazuh_indexer/wazuh.indexer.yml:/usr/share/wazuh-indexer/opensearch.yml
      - ./wazuh/config/wazuh_indexer/internal_users.yml:/usr/share/wazuh-indexer/opensearch-security/internal_users.yml

  wazuh.manager:
    image: wazuh/wazuh-manager:4.9.2
    container_name: purple-lab-wazuh-manager
    hostname: wazuh.manager
    restart: always
    networks:
      - wazuh-net
    depends_on:
      - wazuh.indexer
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 655360
        hard: 655360
    ports:
      # Task 8 (H48): bind to loopback only -- these were published to all
      # host interfaces (agent enrollment, agent data, and syslog were all
      # reachable by anything that could reach the host at all).
      # Fix-round note (item #5): same Docker Desktop caveat as
      # wazuh.indexer's ports: comment above -- wazuh.manager is also
      # wazuh-net-only (internal:true), so these never bind to the host
      # here regardless of the 127.0.0.1 prefix; meaningful on native
      # Linux Docker.
      - "127.0.0.1:1514:1514"
      - "127.0.0.1:1515:1515"
      - "127.0.0.1:514:514/udp"
    # No 55000 (manager REST API) -- host access to it was a debugging
    # convenience only (curl/Postman), not something the experiment needs:
    # nothing on the red/blue/detection path calls it, blue_agent reads
    # alerts via a read-only file mount instead. Previously bound
    # 127.0.0.1:55000:55000 -- observed live to silently and
    # inconsistently drop that binding across Docker Desktop engine
    # restarts (WSL2 networking quirk, not a stale container: the
    # container's own config-hash matched what was on disk, so `up -d`
    # wouldn't have touched it either way). Removed rather than chased,
    # since nothing here depends on it.
    environment:
      - INDEXER_URL=https://wazuh.indexer:9200
      - INDEXER_USERNAME=admin
      # Task 8 (H7/H48): rotated off the upstream demo password. Required,
      # externally supplied -- fails closed if absent. See .env.example.
      - INDEXER_PASSWORD=${WAZUH_INDEXER_PASSWORD:?set WAZUH_INDEXER_PASSWORD before starting the lab}
      - FILEBEAT_SSL_VERIFICATION_MODE=full
      - SSL_CERTIFICATE_AUTHORITIES=/etc/ssl/root-ca.pem
      - SSL_CERTIFICATE=/etc/ssl/filebeat.pem
      - SSL_KEY=/etc/ssl/filebeat.key
      - API_USERNAME=wazuh-wui
      # Task 8 (H7/H48): rotated off the upstream demo password. Required,
      # externally supplied -- fails closed if absent. See .env.example.
      - API_PASSWORD=${WAZUH_API_PASSWORD:?set WAZUH_API_PASSWORD before starting the lab}
    volumes:
      - wazuh_api_configuration:/var/ossec/api/configuration
      - wazuh-manager-config:/var/ossec/etc
      - wazuh_logs:/var/ossec/logs
      - wazuh_queue:/var/ossec/queue
      - wazuh_var_multigroups:/var/ossec/var/multigroups
      - wazuh_integrations:/var/ossec/integrations
      - wazuh_active_response:/var/ossec/active-response/bin
      - wazuh_agentless:/var/ossec/agentless
      - wazuh_wodles:/var/ossec/wodles
      - filebeat_etc:/etc/filebeat
      - filebeat_var:/var/lib/filebeat
      - ./wazuh/config/wazuh_indexer_ssl_certs/root-ca-manager.pem:/etc/ssl/root-ca.pem
      - ./wazuh/config/wazuh_indexer_ssl_certs/wazuh.manager.pem:/etc/ssl/filebeat.pem
      - ./wazuh/config/wazuh_indexer_ssl_certs/wazuh.manager-key.pem:/etc/ssl/filebeat.key
      - ./wazuh/config/wazuh_cluster/wazuh_manager.conf:/wazuh-config-mount/etc/ossec.conf
      # Task 8 (H7/H48): agent-enrollment pre-shared key -- generated
      # locally (gitignored, same treatment as the SSL private keys; see
      # wazuh/README.md), overlaid into /var/ossec/etc/authd.pass by the
      # image's own mount_files() step. Paired with <use_password>yes</use_password>
      # below and target's entrypoint.sh, which mounts the same file to
      # supply agent-auth's -P flag.
      - ./wazuh/config/wazuh_cluster/authd.pass:/wazuh-config-mount/etc/authd.pass:ro
      # Fixed 2026-07-27: was bind-mounted directly to /var/ossec/etc/rules/target_rules.xml,
      # which makes /var/ossec/etc/ look non-empty to the image's own 0-wazuh-init script
      # (mount_permanent_data() checks "is this directory already non-empty" before deciding
      # whether to install the full default config tree from its backup). That caused the
      # manager to skip installing shared/ar.conf, decoders/, lists/, etc. on a fresh volume --
      # analysisd then crashed at boot with "Could not open file 'etc/shared/ar.conf'" and
      # nothing else in the container restarted it, killing the whole detection engine
      # silently. Routed through the image's actual overlay mechanism (WAZUH_CONFIG_MOUNT=
      # /wazuh-config-mount, same pattern already used correctly for ossec.conf above) instead:
      # this lets mount_permanent_data() install the full defaults first, then mount_files()
      # copies this file over top afterward -- confirmed via a from-scratch (`down -v`)
      # rebuild: shared/ar.conf now installs correctly, every Wazuh daemon (analysisd,
      # apid, remoted, etc.) starts and stays running, the API responds (401 unauthenticated,
      # not connection-refused), and target_rules.xml still merges into
      # /var/ossec/etc/rules/ correctly via the overlay.
      - ./wazuh-rules/target_rules.xml:/wazuh-config-mount/etc/rules/target_rules.xml
      - ./wazuh/active-response/lock-account.sh:/var/ossec/active-response/bin/lock-account.sh
      - ./wazuh/active-response/kill-session.sh:/var/ossec/active-response/bin/kill-session.sh
      - ./wazuh/active-response/bruteforce-guard.sh:/var/ossec/active-response/bin/bruteforce-guard.sh
      - ./wazuh/active-response/idor-guard.sh:/var/ossec/active-response/bin/idor-guard.sh

  wazuh.dashboard:
    image: wazuh/wazuh-dashboard:4.9.2
    container_name: purple-lab-wazuh-dashboard
    hostname: wazuh.dashboard
    restart: always
    # Task 8 fix round (finding #1) -- agent-net (and lab-net) DROPPED.
    # H53's real complaint wasn't about ports: publishing (that premise was
    # correctly disproven live during Task 8 and doesn't change here) --
    # it's that red_agent/blue_agent sit on both lab-net and agent-net, and
    # wazuh.dashboard being on either one gives them a direct container-to-
    # container path to a web app carrying H7/H48's credentials, regardless
    # of the host-port loopback binding below (that only restricts *host*
    # access, not bridge-network peer access). dashboard-host-net is a new,
    # single-purpose, non-internal network that ONLY wazuh.dashboard joins
    # -- it exists solely so `ports:` publishing keeps working (a network
    # with internal:true can never have a host-published port bound; see
    # wazuh-net below). No other service is ever added to it. Combined
    # with wazuh-net (for reaching wazuh.manager/wazuh.indexer),
    # red_agent/blue_agent now have zero shared network segment with
    # wazuh.dashboard.
    #
    # Live-verified (not just configured), via curl/connect reachability
    # testing, not `docker inspect` output (a reviewer flagged inspect's
    # port-mapping display as an unreliable signal -- the indexer showed a
    # mapping in inspect while still being unreachable via curl):
    # `curl -k https://127.0.0.1:443/` from the host returns a real
    # response (302); a container on lab-net/agent-net gets a DNS
    # resolution failure resolving the hostname `wazuh.dashboard` (the
    # shared embedded-DNS/hostname path is fully closed); the same
    # container times out connecting by raw IP to wazuh.manager's/
    # wazuh.indexer's wazuh-net (internal:true) addresses, confirming
    # internal:true genuinely blocks cross-network reachability here.
    #
    # RESIDUAL GAP, corrected during the Task 8 second fix round (dual
    # review flagged the original version of this note for overstating
    # what got fixed -- see below for what changed):
    #
    # Raw-IP HTTP(S) access to wazuh.dashboard from agent-net/lab-net
    # containers (red_agent, blue_agent, target) REMAINS OPEN after this
    # fix. Hostname/DNS-based access is genuinely closed (verified live:
    # a container on lab-net/agent-net gets DNS resolution failure for
    # `wazuh.dashboard`), but a container on either network can still open
    # a raw TCP connection straight to dashboard-host-net's IP and reach
    # the FULL dashboard app over HTTPS -- not a narrow surface, the whole
    # login UI and API. The rotated WAZUH_DASHBOARD_PASSWORD is the sole
    # remaining control on that path: this is now credential-only defense
    # for raw-IP access, not network segmentation.
    #
    # The original version of this note attributed the gap to a
    # Docker-Desktop/WSL2 quirk -- missing DOCKER-ISOLATION-STAGE-1/2
    # iptables chains -- and claimed it was "expected to fully isolate on
    # native Linux Docker." That framing does not hold up: code review
    # traced the actual mechanism to something more fundamental than a
    # missing isolation chain. Docker inserts an unconditional ACCEPT rule
    # in the DOCKER iptables chain for every host-published port, matched
    # on destination IP:port only -- it does not condition on which bridge
    # network the source traffic came from. This is Docker's documented
    # "published ports bypass network isolation" behavior (the general
    # class covered by moby/moby#22054), and it is a property of using
    # `ports:` to publish a container's port at all -- not something
    # specific to WSL2's missing isolation chains. It is very likely NOT
    # fixed by running on native Linux Docker instead, since the same
    # DNAT/ACCEPT plumbing applies there too. This has NOT been verified
    # on native Linux Docker in this environment (no such host available)
    # -- treat it as unverified there, believed to reproduce, rather than
    # assume the opposite.
    #
    # Discovering dashboard-host-net's IP is also not a meaningful barrier:
    # Docker assigns addresses on a fresh subnet deterministically and low
    # (typically starting at .2), so it does not require scanning or prior
    # knowledge, just guessing a small, predictable set of addresses.
    #
    # No code-level fix is implemented for this here. A reverse proxy that
    # is the only thing bridging both networks (adding its own access
    # control) or dropping the host-published port in favor of
    # `docker compose exec`/manual port-forwarding would close it, but
    # that's new infrastructure out of scope for this fix round --
    # documented as an accepted, known residual risk instead (same
    # disclosure posture as H46's accepted-tradeoff row), matching this
    # project's preference for honest disclosure over unscoped new
    # engineering in a coursework/portfolio lab.
    networks:
      - wazuh-net
      - dashboard-host-net
    depends_on:
      - wazuh.indexer
      - wazuh.manager
    ports:
      # Task 8 (H48): bind to loopback only -- was published to all host
      # interfaces.
      - "127.0.0.1:443:5601"
    # Task 8 fix round (finding #2): the image's own /wazuh_app_config.sh
    # only auto-populates wazuh.yml's manager-API host block from
    # API_USERNAME/API_PASSWORD when that block isn't already present --
    # our committed wazuh.yml always has it (with a placeholder password),
    # so that auto-populate path never fires. This thin wrapper (same
    # pattern as target/entrypoint.sh) copies the committed template into
    # the runtime config volume and substitutes the real, rotated
    # WAZUH_API_PASSWORD in at container start, then execs the image's
    # real entrypoint unchanged. See wazuh/config/wazuh_dashboard/entrypoint.sh.
    entrypoint: ["/bin/bash", "/wazuh_dashboard_entrypoint.sh"]
    environment:
      - INDEXER_USERNAME=admin
      # Task 8 (H7/H48): rotated off the upstream demo password. Required,
      # externally supplied -- fails closed if absent. See .env.example.
      - INDEXER_PASSWORD=${WAZUH_INDEXER_PASSWORD:?set WAZUH_INDEXER_PASSWORD before starting the lab}
      - WAZUH_API_URL=https://wazuh.manager
      - DASHBOARD_USERNAME=kibanaserver
      # Task 8 (H7/H48): rotated off the upstream demo password. Required,
      # externally supplied -- fails closed if absent. See .env.example.
      - DASHBOARD_PASSWORD=${WAZUH_DASHBOARD_PASSWORD:?set WAZUH_DASHBOARD_PASSWORD before starting the lab}
      - API_USERNAME=wazuh-wui
      # Task 8 fix round (finding #2): also templated into wazuh.yml by
      # wazuh_dashboard_entrypoint.sh below -- that's the wazuh-app
      # plugin's manager-API auth path, distinct from this env var (which
      # only feeds wazuh_app_config.sh's skip-if-already-configured check).
      - API_PASSWORD=${WAZUH_API_PASSWORD:?set WAZUH_API_PASSWORD before starting the lab}
    volumes:
      - ./wazuh/config/wazuh_indexer_ssl_certs/wazuh.dashboard.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard.pem
      - ./wazuh/config/wazuh_indexer_ssl_certs/wazuh.dashboard-key.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard-key.pem
      - ./wazuh/config/wazuh_indexer_ssl_certs/root-ca.pem:/usr/share/wazuh-dashboard/certs/root-ca.pem
      - ./wazuh/config/wazuh_dashboard/opensearch_dashboards.yml:/usr/share/wazuh-dashboard/config/opensearch_dashboards.yml
      # Task 8 fix round (finding #2): mounted read-only to a staging path,
      # NOT to the live config path -- wazuh_dashboard_entrypoint.sh copies
      # it into the wazuh-dashboard-config volume below with the real
      # password substituted in (bash %%/# splitting + concatenation, not
      # sed -- see entrypoint.sh), so the substitution never writes into
      # this bind-mounted, git-tracked file (which would otherwise leak
      # the rotated secret into the working tree on every container start).
      - ./wazuh/config/wazuh_dashboard/wazuh.yml:/wazuh_dashboard_config_template/wazuh.yml:ro
      - ./wazuh/config/wazuh_dashboard/entrypoint.sh:/wazuh_dashboard_entrypoint.sh:ro
      - wazuh-dashboard-config:/usr/share/wazuh-dashboard/data/wazuh/config
      - wazuh-dashboard-custom:/usr/share/wazuh-dashboard/plugins/wazuh/public/assets/custom

networks:
  lab-net:
    driver: bridge
    internal: true
  wazuh-net:
    driver: bridge
    internal: true
    # Task 8 (H7 network-segmentation half, closes the H48-sharpened
    # remainder of the original H7 decision): the Wazuh control plane's
    # own network -- wazuh.manager, wazuh.indexer, wazuh.dashboard, and
    # target (multi-homed, for agent enrollment only). red_agent and
    # blue_agent are deliberately never attached here -- neither talks to
    # the manager/indexer over the network (blue reads Wazuh's alert
    # stream via a read-only volume mount, not the API/indexer), so
    # neither needs to be. This is what makes host-reachable ports: on
    # wazuh.manager/wazuh.indexer independent of lab-net/agent-net
    # membership, same proof pattern H53 relied on for wazuh.dashboard.
    #
    # RESIDUAL RISK (fix round, security review item #3, not a new
    # regression): target is multi-homed onto wazuh-net for agent
    # enrollment, and target has a seeded RCE by design plus NET_ADMIN/
    # NET_RAW (target is considered compromised-by-design, same invariant
    # agent-net's comment below documents). Once target is compromised --
    # red_agent's designed win condition -- that gives a direct route into
    # this otherwise-isolated network, including reading the enrollment
    # PSK file (wazuh/config/wazuh_cluster/authd.pass) directly off disk.
    # This is accepted, not re-architected here: wazuh-net isolates
    # red_agent/blue_agent directly, not a compromised target, and target
    # already needed manager connectivity before this task.
  dashboard-host-net:
    driver: bridge
    # Task 8 fix round (finding #1): single-purpose network, ONLY
    # wazuh.dashboard is ever attached to it -- do not add any other
    # service. Exists solely so wazuh.dashboard's port 443 host-publish
    # keeps working: a network with internal:true can never have a
    # host-published port bound (verified live, see wazuh.dashboard's own
    # networks: comment), so wazuh.dashboard needs at least one
    # non-internal network. No other service joins it, and hostname/DNS
    # access from red_agent/blue_agent is confirmed blocked.
    #
    # Corrected in the Task 8 second fix round: raw-IP HTTP(S) reachability
    # from agent-net/lab-net is NOT fully closed by this network split --
    # see the full RESIDUAL GAP note on wazuh.dashboard's networks:
    # comment above for the mechanism (Docker's per-published-port ACCEPT
    # rule in the DOCKER iptables chain, independent of source network --
    # a general `ports:` publishing behavior, very likely not specific to
    # this Docker Desktop/WSL2 engine and unverified as fixed on native
    # Linux Docker) and the residual risk it leaves (full dashboard app
    # reachable by raw IP, gated only by WAZUH_DASHBOARD_PASSWORD).
  target-host-net:
    driver: bridge
    # H71: single-purpose network, ONLY target-relay is ever attached to
    # it -- never target itself, and do not add any other service.
    # target's own "ports: 127.0.0.1:5000:5000" (added directly to target
    # in this network, in the first H71 attempt) silently never worked --
    # target's only networks were lab-net/wazuh-net, both internal:true,
    # and a network with internal:true can never have a host-published
    # port bound (confirmed live via `docker inspect` showing an empty
    # NetworkSettings.Ports despite HostConfig.PortBindings accepting the
    # mapping).
    #
    # CORRECTED (security review of the first H71 attempt): attaching
    # target itself to this non-internal network fixed the port publish
    # but also silently gave target real internet egress -- confirmed
    # live (`curl https://example.com/` from inside target returned 200)
    # -- because non-internal bridge networks get Docker's default
    # outbound NAT/masquerade rule. That breaks this project's explicit
    # Non-Negotiable (docs/design.md: target stays fully egress-blocked,
    # no real internet egress, ever) and matters concretely here: target
    # carries a seeded OS command injection with NET_ADMIN, so real
    # egress is a real post-compromise exfiltration/C2 channel. Fixed by
    # moving this network membership + the port publish onto a new
    # target-relay service (see its own comment) that does nothing but
    # forward TCP to target:5000 -- target itself now has zero non-
    # internal network membership again, same as before H71.
    #
    # Same residual caveat as dashboard-host-net (Task 8 fix round 2): raw-
    # IP reachability to a published port is not fully gated by network
    # membership on this Docker Desktop/WSL2 engine (Docker's per-
    # published-port ACCEPT rule doesn't check source network) -- so
    # anything else on this Docker host with a route to a non-internal
    # network, including round_helper (agent-net) and containers from
    # unrelated projects, could in principle reach target-relay:5000 by
    # raw IP even without target-host-net membership. Unlike the
    # dashboard-host-net case, this is genuinely inconsequential here:
    # target-relay has no application code, no credentials, no data, and
    # initiates no outbound connections except to target:5000 on lab-net
    # -- there is nothing on it to compromise or exfiltrate. It exists
    # solely to make the host-level port publish work for a human
    # operator, and reaching it grants nothing beyond what the front door
    # (http://localhost:5000) already grants by design.
  agent-net:
    driver: bridge
    # Deliberately NOT internal — this is how red/blue agent containers
    # reach Ollama running on the host. The target container is never
    # attached to this network; that's what preserves the egress-block
    # guarantee verified for lab-net.
    #
    # INVARIANT: `target` must never be added to agent-net (or otherwise
    # bridged to round_helper). target is considered compromised-by-design
    # (it's the deliberately RCE-able host), so even with round_helper now
    # on its own dedicated ROUND_HELPER_TOKEN (H54, distinct from
    # target's INTERNAL_ACTION_TOKEN) network segmentation stays the primary
    # control -- defense-in-depth, not a reason to relax it now that the
    # token split has landed.

volumes:
  target-logs:
  event-log:
  red-memory:
  blue-memory:
  referee-state:
  referee-logs:
  wazuh-indexer-data:
  wazuh-manager-config:
  wazuh_api_configuration:
  wazuh_logs:
  wazuh_queue:
  wazuh_var_multigroups:
  wazuh_integrations:
  wazuh_active_response:
  wazuh_agentless:
  wazuh_wodles:
  filebeat_etc:
  filebeat_var:
  wazuh-dashboard-config:
  wazuh-dashboard-custom:
